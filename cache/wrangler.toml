# 練習室予約の高速キャッシュ（Cloudflare Workers）の設定。
# main に push すると、GitHub Actions（.github/workflows/cache-deploy.yml）がこの設定で Cloudflare に公開する。
name = "yoyaku-cache"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# 写しを置く D1 データベース。database_id は Cloudflare の画面（Storage & Databases > D1）で作ったものの ID。
[[d1_databases]]
binding = "DB"
database_name = "yoyaku-cache"
database_id = "6cc35b07-83a0-4e3d-a9ef-ee0d77f951b0"

# 管理画面のパスキー（Face ID / Touch ID）ログイン。使うサイトのドメインと起点。
# PASSKEY_RP_ID を空にすると、パスキーは使えなくなる（管理用パスワードだけになる）。
[vars]
PASSKEY_RP_ID = "miyakyo-music.github.io"
PASSKEY_ORIGIN = "https://miyakyo-music.github.io"

# リアルタイム同期: 予約表を開いている画面とのつながりをまとめて持つ Durable Object（worker.js の Hub）。
# 無料のプランで使えるのは SQLite を使う形だけなので new_sqlite_classes にする。
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]
