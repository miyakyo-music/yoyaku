<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // ダークモード: 端末の設定に合わせる（URL に ?dark で常にダーク、?light で常にライト）
  (function () {
    var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
    var apply = function () { document.documentElement.classList.toggle('dark', /[?&]dark\b/.test(location.search) || (!/[?&]light\b/.test(location.search) && !!(mq && mq.matches))); };
    apply();
    if (mq && mq.addEventListener) mq.addEventListener('change', apply);
  })();
</script>
<meta name="robots" content="noindex">
<meta name="description" content="宮教大音楽棟 練習室予約の管理者画面の使い方（教員向け）。管理者ログインで演習室の予約と一括予約ができます。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>管理者画面の使い方｜宮教大音楽棟 練習室予約</title>
<style>
  :root {
    --bg: #f2f2f7; --surface: #fff; --text: #1c1c1e; --muted: #6e6e73; --line: rgba(60, 60, 67, .16); --accent: #007aff;
    --key-bg: #eef4fb; --key-line: #1f5fa8; --key-title: #1f3f78; --th-bg: #f2f2f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text); line-height: 1.85; font-size: 15.5px; -webkit-text-size-adjust: 100%;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, rgba(0, 122, 255, .08), transparent 60%),
                radial-gradient(900px 500px at 110% 10%, rgba(255, 149, 0, .07), transparent 60%), var(--bg);
    background-attachment: fixed;
  }
  a { color: var(--accent); }
  .topbar {
    position: sticky; top: 0; z-index: 2; box-shadow: 0 .5px 0 var(--line); background: rgba(255, 255, 255, .72);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  }
  .back {
    display: inline-flex; align-items: center; height: 30px; padding: 0 10px; border-radius: 9px; text-decoration: none; font-size: 13px;
    color: var(--accent); font-weight: 500; background: rgba(255, 255, 255, .7);
    box-shadow: inset 0 1px 0 #fff, 0 0 0 .5px rgba(0, 0, 0, .08), 0 2px 8px rgba(0, 0, 0, .07);
  }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
  .card { border-radius: 18px; padding: 28px; background: rgba(255, 255, 255, .8); box-shadow: inset 0 1px 0 #fff, 0 0 0 .5px rgba(0, 0, 0, .05), 0 8px 24px rgba(0, 0, 0, .05); }
  header.doc { text-align: center; margin-bottom: 24px; }
  header.doc .sub { margin: 0; font-size: 16px; }
  header.doc h1 { margin: 2px 0 4px; font-size: 26px; font-weight: 600; }
  header.doc .meta { margin: 0; color: var(--muted); font-size: 13px; }
  .key { background: var(--key-bg); border: 2px solid var(--key-line); border-radius: 14px; padding: 18px 22px; }
  .key .key-title { margin: 0 0 10px; font-weight: 600; font-size: 18px; line-height: 1.6; color: var(--key-title); }
  .key p:last-child { margin-bottom: 0; font-size: 14px; }
  .key .key-sub { margin: 18px 0 6px; padding-top: 14px; border-top: 1px solid var(--line); font-weight: 600; font-size: 16px; color: var(--key-title); }
  .toc { margin: 22px 0 8px; padding: 14px 20px; border-radius: 14px; background: var(--th-bg); }
  .toc-title { margin: 0 0 4px; font-weight: 600; }
  .toc ol { margin: 0; padding-left: 1.6em; columns: 2; column-gap: 32px; }
  b, strong, h2, h3, th { font-weight: 600; } /* 700 だと Mac のヒラギノ角ゴで太すぎて文字が潰れる */
  h2 { font-size: 20px; color: var(--key-title); margin: 40px 0 12px; padding-bottom: 6px; border-bottom: 1.5px solid var(--key-line); scroll-margin-top: 64px; }
  h3 { font-size: 16.5px; margin: 26px 0 8px; }
  p { margin: 0 0 12px; }
  ol, ul { margin: 6px 0 14px; padding-left: 1.6em; }
  li + li { margin-top: 6px; }
  .tbl { overflow-x: auto; margin: 10px 0 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.7; }
  th, td { text-align: left; vertical-align: top; padding: 9px 12px; border: 1px solid var(--line); }
  thead th { background: var(--th-bg); }
  tbody th { font-weight: 600; width: 32%; }
  figure { margin: 18px auto 22px; text-align: center; }
  figure img { width: 100%; height: auto; border-radius: 10px; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .12), 0 4px 16px rgba(0, 0, 0, .08); }
  figcaption { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .site-foot { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
  @media (max-width: 600px) {
    body { font-size: 15px; }
    .card { padding: 18px 16px; }
    header.doc h1 { font-size: 22px; }
    .key { padding: 14px 16px; }
    .toc ol { columns: 1; }
    .tbl thead { display: none; }
    .tbl table, .tbl tbody, .tbl tr, .tbl tbody th, .tbl td { display: block; width: auto; }
    .tbl table { border-top: 1px solid var(--line); }
    .tbl tbody th, .tbl td { border: 0; padding: 0 4px; }
    .tbl tr { padding: 10px 0; border-bottom: 1px solid var(--line); }
  }
  @media print {
    .topbar { display: none; }
    body { background: #fff; }
    .card { box-shadow: none; padding: 0; }
  }
  /* ダークモード（予約表と同じ色）: 端末がダークモードのとき（または URL に ?dark）、html に .dark を付ける */
  html.dark {
    color-scheme: dark; --bg: #000; --surface: #1c1c1e; --text: #fff; --muted: #8e8e93; --line: rgba(84, 84, 88, .6); --accent: #409cff;
    --key-bg: rgba(64, 156, 255, .12); --key-line: #409cff; --key-title: #8cc2ff; --th-bg: #2c2c2e;
  }
  html.dark body { background: var(--bg); }
  html.dark .topbar { background: rgba(0, 0, 0, .82); }
  html.dark .back { background: #262628; box-shadow: inset 0 .5px 0 rgba(255, 255, 255, .14); }
  html.dark .card { background: var(--surface); box-shadow: none; }
  html.dark figure img { box-shadow: 0 0 0 .5px rgba(255, 255, 255, .18); }
</style>
</head>
<body>
<div class="topbar"><a class="back" href="admin.html">‹ 管理画面へ</a></div>
<main>
  <article class="card">
    <header class="doc">
      <p class="sub">{{SUB}}</p>
      <h1>{{TITLE}}</h1>
      <p class="meta">{{META}}</p>
    </header>
{{BODY}}
  </article>
  <footer class="site-foot"><a href="./">予約表</a>・<a href="privacy.html">プライバシーポリシー</a></footer>
</main>
</body>
</html>
