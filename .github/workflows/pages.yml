# main に push すると、試験が通ってから web/ フォルダの中身を GitHub Pages に公開する（試験が通らなければ公開しない）
name: GitHub Pages に公開

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # 公開の途中で止めると、半端な状態が残ることがあるので、前の公開が終わるのを待つ

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 試験をまとめて流す
        run: node --test 'dev/test/*.test.js'

  deploy:
    needs: test   # 試験が通らなければ公開しない
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # ブラウザのキャッシュに古い CSS・JS やアイコンが残らないよう、公開のたびに読み込み先を変える
      # （config.js・api.js と、部品のフォルダ index/・admin/・shared/ の中の .js・.css すべて）
      - name: スクリプト・アイコンの URL に版を付ける
        run: |
          sed -i -E "s#(src|href)=\"(([a-z0-9-]+/)?[a-z0-9-]+\.(js|css))\"#\1=\"\2?v=${GITHUB_SHA::8}\"#g" web/*.html
          sed -i -E "s/href=\"(favicon\.svg|favicon-32\.png|apple-touch-icon\.png)\"/href=\"\1?v=${GITHUB_SHA::8}\"/" web/*.html
          grep -hE '(src|href)="[a-z0-9/-]*\.(js|css|svg|png)' web/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
