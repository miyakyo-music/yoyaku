# main に push すると、web/ フォルダの中身を GitHub Pages に公開する
name: GitHub Pages に公開

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # ブラウザのキャッシュに古い config.js / api.js が残らないよう、公開のたびに読み込み先を変える
      - name: スクリプトの URL に版を付ける
        run: sed -i -E "s/src=\"(config|api)\.js\"/src=\"\1.js?v=${GITHUB_SHA::8}\"/" web/*.html && grep -h 'src="[a-z]*\.js' web/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
