# main に push すると、web/ フォルダの中身を GitHub Pages に公開する
name: GitHub Pages に公開

on:
  push:
    branches: [main]
    paths: ['web/**', 'dev/bundle.js', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # 公開の途中で止めると、半端な状態が残ることがあるので、前の公開が終わるのを待つ

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 起動を速くするため、予約表と管理画面が読む CSS・JS を、それぞれ1つのファイル（bundle/）にまとめる
      # （この作業コピーの web/ だけを書き換える。やり方は dev/bundle.js の先頭）
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CSS・JS をまとめる
        run: node dev/bundle.js web
      # ブラウザのキャッシュに古い CSS・JS やアイコンが残らないよう、公開のたびに読み込み先を変える
      # （まとめたファイル bundle/ と、privacy.html の api.js など、HTML が読む .js・.css すべて）
      # sw.js は、この ?v= の付いたものを、端末に保存したものから出す（仕様書 2.10.5）
      - name: スクリプト・アイコンの URL に版を付ける
        run: |
          sed -i -E "s#(src|href)=\"(([a-z0-9-]+/)?[a-z0-9-]+\.(js|css))\"#\1=\"\2?v=${GITHUB_SHA::8}\"#g" web/*.html
          sed -i -E "s/href=\"(favicon\.svg|favicon-32\.png|apple-touch-icon\.png)\"/href=\"\1?v=${GITHUB_SHA::8}\"/" web/*.html
          grep -hE '(src|href)="[a-z0-9/-]*\.(js|css|svg|png)' web/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
