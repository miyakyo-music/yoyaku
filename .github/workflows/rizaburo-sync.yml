# 【一時的】りざぶ郎の予約を、期間を指定して移す（過去分の取り込みなど）。ふだんの移行は Cloudflare が5分ごとに行う
# （cache/worker.js の scheduled）。りざぶ郎から切り替わったら、このファイルも消す（仕様書 4.7）。
# 「Run workflow」で開始日・終了日を入れる。23日ずつ Cloudflare の /rizaburo/run（合言葉が要る）に頼む
name: りざぶ郎から予約を移す（期間を指定）

on:
  workflow_dispatch:
    inputs:
      from:
        description: '開始日（例: 2026-09-01）'
        required: true
      to:
        description: '終了日（空なら開始日と同じ）'
        required: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 移す
        env:
          TOKEN: ${{ secrets.CACHE_PUSH_TOKEN }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          to="${TO:-$FROM}"; d="$FROM"; fail=0
          while [[ ! "$d" > "$to" ]]; do
            e=$(date -d "$d +22 days" +%F); [[ "$e" > "$to" ]] && e="$to"
            res=$(curl -s -X POST -H "Authorization: Bearer $TOKEN" "https://yoyaku-cache.kuridanho.workers.dev/rizaburo/run?from=$d&to=$e")
            # 結果は件数だけ（名前は入っていない）
            echo "$d〜$e: $res"
            echo "$res" | grep -q '"ok":true' || fail=1
            d=$(date -d "$e +1 day" +%F)
          done
          exit $fail
